name: ${COMPOSE_PROJECT_NAME:-tsuz-web-main}

services:
  app:
    image: ${DOCKER_IMAGE_NAME:-tsuz-web-main}:${APP_VERSION:-local}
    container_name: ${CONTAINER_NAME:-tsuz-web-main}
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_ADMIN_APP_ENTRY: ${VITE_ADMIN_APP_ENTRY:-//127.0.0.1:7201/}
        VITE_APP_ENV: ${APP_ENV:-local}
    environment:
      APP_ENV: ${APP_ENV:-local}
    ports:
      - "${APP_PORT:-7200}:80"
    restart: unless-stopped
